name: personal_monitor_mobile

description: "My Digital Diary — mobile companion app for iOS and Android"

publish_to: 'none'

version: 1.0.0+1


# =============================================================================
# ENVIRONMENT
# =============================================================================

environment:
  sdk: '>=3.12.0 <4.0.0'


# =============================================================================
# DEPENDENCIES
# =============================================================================

dependencies:

  flutter:
    sdk: flutter


  # ---------------------------------------------------------------------------
  # UI
  # ---------------------------------------------------------------------------

  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1


  # ---------------------------------------------------------------------------
  # STATE MANAGEMENT
  # ---------------------------------------------------------------------------

  provider: ^6.1.2


  # ---------------------------------------------------------------------------
  # NETWORKING
  # ---------------------------------------------------------------------------

  http: ^1.2.1

  http_parser: ^4.1.2

  connectivity_plus: ^6.0.5


  # ---------------------------------------------------------------------------
  # AUTHENTICATION / LOCAL STORAGE
  # ---------------------------------------------------------------------------

  # Secure storage for:
  # - Sanctum Bearer tokens
  # - authentication tokens
  # - sensitive local values
  flutter_secure_storage: ^10.3.1

  # Application preferences and non-sensitive settings.
  shared_preferences: ^2.2.3

  # Stable locally generated identifiers.
  uuid: ^4.4.0


  # ---------------------------------------------------------------------------
  # FIREBASE / PUSH NOTIFICATIONS
  # ---------------------------------------------------------------------------

  firebase_core: ^3.1.0

  firebase_messaging: ^15.0.1


  # ---------------------------------------------------------------------------
  # LOCAL NOTIFICATIONS
  # ---------------------------------------------------------------------------

  # Used for:
  # - reminders
  # - daily planner reminders
  # - project task reminders
  # - meetings
  # - debt reminders
  # - savings reminders
  # - subscription reminders
  flutter_local_notifications: ^17.1.2

  # Timezone-aware notification scheduling.
  timezone: ^0.9.4


  # ---------------------------------------------------------------------------
  # DATE / TIME
  # ---------------------------------------------------------------------------

  intl: ^0.19.0


  # ---------------------------------------------------------------------------
  # FILES / DEVICE STORAGE
  # ---------------------------------------------------------------------------

  # File and document attachments.
  file_picker: ^10.3.8

  # Temporary and application storage directories.
  path_provider: ^2.1.3


  # ---------------------------------------------------------------------------
  # IMAGES / CAMERA / DOCUMENT SCANNING
  # ---------------------------------------------------------------------------

  # Camera and gallery selection.
  image_picker: ^1.1.2

  # Receipt / document scanning.
  google_mlkit_document_scanner: ^0.5.0


  # ---------------------------------------------------------------------------
  # AUDIO / VOICE
  # ---------------------------------------------------------------------------

  # Audio/meeting recording.
  record: ^7.1.1

  # Speech recognition / voice dictation.
  speech_to_text: ^7.0.0


  # ---------------------------------------------------------------------------
  # URLS / EXTERNAL APPLICATIONS
  # ---------------------------------------------------------------------------

  # Websites, Stripe, PDF links, tel:, mailto:, etc.
  url_launcher: ^6.3.0

  # Native sharing.
  share_plus: ^12.0.2


  # ---------------------------------------------------------------------------
  # CHARTS / ANALYTICS
  # ---------------------------------------------------------------------------

  fl_chart: ^0.68.0


  # ---------------------------------------------------------------------------
  # HEALTH / WELLBEING / STEP TRACKING
  # ---------------------------------------------------------------------------

  # Primary Android step-counter source.
  #
  # IMPORTANT:
  # Not every Android phone contains a native step-counter sensor.
  # Always handle stream errors and unsupported hardware.
  pedometer: ^4.1.1

  # Accelerometer/motion fallback when a native step counter is unavailable.
  sensors_plus: ^7.0.0

  # Runtime permission management.
  #
  # Used for:
  # - ACTIVITY_RECOGNITION
  # - CAMERA
  # - MICROPHONE
  # - NOTIFICATIONS
  # - Bluetooth where applicable
  permission_handler: ^12.0.1
  local_auth: 3.0.2


# =============================================================================
# DEVELOPMENT DEPENDENCIES
# =============================================================================

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.13.1


# =============================================================================
# FLUTTER
# =============================================================================

flutter:

  uses-material-design: true

  assets:
    - assets/icon/


# =============================================================================
# FLUTTER LAUNCHER ICONS
# =============================================================================

flutter_launcher_icons:

  android: true

  ios: true

  remove_alpha_ios: true

  image_path: "assets/icon/app_icon.png"