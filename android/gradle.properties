# Conservative JVM limits for Windows Android builds.
# 8G heap + 4G metaspace can starve native/JNI memory and make the JVM
# disappear abruptly on machines that do not have enough free RAM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=2

android.useAndroidX=true
android.enableJetifier=true
# Kept disabled because several current Flutter plugins still apply KGP
# themselves. Their warning is informational and separate from the JVM crash.
android.newDsl=false
android.builtInKotlin=false

kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1024m
